<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Support — JumpLink</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://jumplink.eu/en/support/">
<meta http-equiv="refresh" content="0; url=/en/support/">
<script>
  // The support page moved under a language; keep the old /support/ links working.
  const lang = navigator.languages.some((l) => l.toLowerCase().startsWith('de')) ? 'de' : 'en';
  location.replace(`/${lang}/support/`);
</script>
</head>
<body>
<p><a href="/en/support/">Support</a> · <a href="/de/support/">Unterstützen</a></p>
</body>
</html>
