name: Deploy site

# Builds jumplink.eu (`gjsify site build` from the gjsify.site block in package.json) and publishes
# it as the Pages artifact of this user site. The app sites under /beifahrer/ etc. are their own
# repositories' gh-pages branches.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The hub reads each app's name, summary and icon from its published site; a daily rebuild
  # carries their changes over without a commit here.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `gjsify site` runs on gjs, which ubuntu-latest lacks; same container as the app sites.
    container:
      image: fedora:44
    steps:
      # GdkPixbuf with the AVIF and WebP loaders resizes the images and draws the preview cards;
      # librsvg renders the app icons.
      - name: Install system prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs json-glib libsoup3 gdk-pixbuf2 librsvg2 avif-pixbuf-loader webp-pixbuf-loader

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Node 24: gjsify's native install-backend prebuilds target node 24.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: gjsify-tarballs-

      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies
        run: gjsify install --immutable

      # The `build` script bundles the scene for the browser, then the generator for gjs, runs it
      # and copies `static/` (.nojekyll and the old /support/ redirect) over the output.
      - name: Build the site
        run: gjsify run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
