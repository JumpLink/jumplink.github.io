name: Deploy GitHub Page

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # The support overview reads the apps' metainfo from their repositories;
  # a daily rebuild carries their changes over without a commit here.
  schedule:
    - cron: "17 4 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    # The overview generator spawns `gjs` and rasterises its link-preview cards
    # with GdkPixbuf, so build in the same Fedora 43 container the apps use.
    container:
      image: fedora:43

    steps:
    - name: Install container prerequisites (incl. gjs)
      # glycin-loaders + modules-extra give GdkPixbuf the AVIF/WebP loaders the
      # apps' screenshots need.
      run: dnf install -y git tar xz findutils gjs json-glib libsoup3 pango gtk4 gdk-pixbuf2 gdk-pixbuf2-modules-extra glycin-loaders
    - name: Checkout
      uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - name: Build
      run: |
        corepack enable
        yarn install
        yarn build
    - name: Fetch the apps for the support overview
      run: |
        for app in Learn6502 beifahrer steuererklaerung; do
          git clone --depth 1 "https://github.com/JumpLink/$app" ".apps/$app"
        done
    - name: Build the support overview
      working-directory: support
      run: |
        npm ci
        npm run build
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        # Upload entire repository
        path: './_site'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4